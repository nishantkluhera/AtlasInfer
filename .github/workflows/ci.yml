name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,benchmark]"

      - name: Byte-compile all sources (syntax check, incl. benchmark harnesses)
        run: python -m compileall -q atlasinfer benchmark.py compare_baselines.py eval_downstream.py bench_latency.py reproduce.py

      - name: Import smoke test (harness modules load without a GPU)
        run: python -c "import atlasinfer, benchmark, compare_baselines, eval_downstream, reproduce; print('imports OK')"

      # -rs prints the reason for every skip. The GitHub runner is CPU-only, so
      # the Triton/CUDA kernel tests skip here — that is expected, but it must be
      # VISIBLE. A green check on a suite that silently skipped the kernel
      # correctness tests reads as "kernels verified" when nothing was verified.
      - name: Run tests
        run: pytest tests/ -v -rs

      - name: Report untested-on-CI surface
        if: always()
        run: |
          echo "::warning::CI runs CPU-only. Triton W8A16/W4A16 kernel correctness"
          echo "::warning::tests are SKIPPED here and must be run on a CUDA host:"
          echo "::warning::  pytest tests/test_triton_kernels.py -v"
          echo "::warning::See docs/wsl_triton.md for the WSL2 setup."
